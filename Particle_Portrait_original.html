<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Particle Portrait</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; overflow: hidden; touch-action: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e8e8ed; }
    #canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 280px; background: #14141f; border: 1px solid #2a2a3a; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); backdrop-filter: blur(20px); display: flex; flex-direction: column; z-index: 100; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid #2a2a3a; }
    .panel-header h2 { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: #888899; }
    #controls-content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    .slider-label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .slider-label output { font-variant-numeric: tabular-nums; color: #00d4aa; font-weight: 600; min-width: 40px; text-align: right; }
    input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: #333344; border-radius: 3px; outline: none; cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: #00d4aa; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .file-label { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #0d0d14; border: 1px solid #333344; border-radius: 8px; cursor: pointer; }
    .file-label:hover { border-color: #00d4aa; }
    #file-input { display: none; }
    .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; }
    .checkbox-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: #00d4aa; }
    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #00d4aa; color: #0a0a0f; }
    .btn-secondary { background: #2a2a3a; color: #e8e8ed; }
    .info { margin-top: auto; padding-top: 16px; border-top: 1px solid #2a2a3a; font-size: 12px; color: #888899; }
    .info output { color: #00d4aa; }
    @media (max-width: 768px) { .panel { top: auto; right: 0; left: 0; bottom: 0; width: 100%; max-height: 50vh; border-radius: 12px 12px 0 0; border-bottom: none; } }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="controls" class="panel">
    <div class="panel-header">
      <h2>Particle Portrait</h2>
    </div>
    <div id="controls-content">
      <div class="control-group">
        <label class="file-label">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Load Image</span>
        </label>
        <input type="file" id="file-input" accept="image/*">
      </div>
      <div class="control-group">
        <label class="slider-label"><span>Particles</span><output id="particle-count-value">8000</output></label>
        <input type="range" id="particle-count" min="1000" max="50000" value="8000" step="1000">
      </div>
      <div class="control-group">
        <label class="slider-label"><span>Size</span><output id="particle-size-value">2.5</output></label>
        <input type="range" id="particle-size" min="0.5" max="8" value="2.5" step="0.1">
      </div>
      <div class="control-group">
        <label class="slider-label"><span>Speed</span><output id="particle-speed-value">1.0</output></label>
        <input type="range" id="particle-speed" min="0.1" max="3" value="1" step="0.1">
      </div>
      <div class="control-group">
        <label class="slider-label"><span>Interaction Radius</span><output id="interaction-radius-value">100</output></label>
        <input type="range" id="interaction-radius" min="20" max="300" value="100" step="10">
      </div>
      <div class="control-group">
        <label class="slider-label"><span>Interaction Strength</span><output id="interaction-strength-value">0.5</output></label>
        <input type="range" id="interaction-strength" min="0" max="2" value="0.5" step="0.1">
      </div>
      <div class="control-group">
        <label class="slider-label"><span>Return Speed</span><output id="return-speed-value">0.02</output></label>
        <input type="range" id="return-speed" min="0.005" max="0.1" value="0.02" step="0.005">
      </div>
      <div class="control-group">
        <label class="checkbox-label"><input type="checkbox" id="color-mode" checked><span>Color Mode</span></label>
      </div>
      <div class="control-group">
        <label class="checkbox-label"><input type="checkbox" id="show-original" checked><span>Show Original</span></label>
      </div>
      <div class="actions">
        <button id="reset-btn" class="btn btn-secondary">Reset</button>
        <button id="export-btn" class="btn btn-primary">Export PNG</button>
      </div>
      <div class="info">
        <p id="fps-counter">FPS: --</p>
        <p id="particle-info">Particles: 0</p>
      </div>
    </div>
  </div>
  <script>
    // Original minified/obfuscated particle logic was in a base64 blob
    // This is a placeholder - the actual logic was embedded in the SRC constant
    console.log('Original Particle Portrait - logic was in embedded base64 blob');
  </script>
</body>
</html>
