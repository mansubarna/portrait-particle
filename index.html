<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Particle Portrait - Turn any photo into an interactive living particle simulation with fluid physics and 60 FPS performance.">
  <title>Particle Portrait - Living Particle Simulation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Interactive Stage -->
  <main id="stage">
    <canvas id="canvas" aria-label="Particle Portrait Canvas"></canvas>
  </main>

  <!-- Top App Header with App Name, Branding & Top-Right "Your Photo" Button -->
  <header id="app-header" class="app-header">
    <div class="brand">
      <div class="brand-badge" aria-hidden="true">✨</div>
      <div class="brand-meta">
        <h1 class="brand-title">Particle Portrait</h1>
        <span class="brand-sub">Living Particle Simulation</span>
      </div>
    </div>

    <!-- Prominent Top-Right "Your Photo" CTA Button -->
    <div class="header-actions">
      <label class="action-top-upload" title="Upload your own photo or portrait">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span>Your Photo</span>
        <input type="file" id="f-top" accept="image/*" hidden>
      </label>
    </div>
  </header>

  <!-- Floating Action Bar: Revealed Once Rendered (Customize, Export, Replay) -->
  <div id="render-actions-bar" class="render-actions-bar hidden" role="toolbar" aria-label="Portrait Actions">
    <button id="quick-customize-btn" class="action-pill action-customize" title="Customize Particles, Physics & Colors" aria-expanded="false">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Customize</span>
    </button>

    <button id="quick-gyro-btn" class="action-pill action-gyro" title="Toggle Mobile Gyroscope Gravity Physics" aria-pressed="false">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="3" ry="3"></rect>
        <circle cx="12" cy="18" r="1" fill="currentColor"></circle>
        <path d="M2 10l2 2-2 2"></path>
        <path d="M22 10l-2 2 2 2"></path>
      </svg>
      <span>Gravity</span>
    </button>

    <button id="quick-export-btn" class="action-pill action-export" title="Export Portrait (PNG, Video, Settings)" aria-expanded="false">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      <span>Export</span>
    </button>

    <button id="quick-replay-btn" class="action-pill action-replay" title="Replay Entrance Animation (Space)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
      </svg>
      <span>Replay</span>
    </button>
  </div>

  <!-- Floating Export Panel (Opens directly from the Export action button) -->
  <div id="export-popup" class="export-popup collapsed" role="dialog" aria-label="Export Options">
    <div class="export-popup-header">
      <span class="export-popup-title">Export Portrait</span>
      <button id="close-export-btn" class="console-icon-btn close-btn" title="Close Export">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="export-popup-body">
      <div class="export-btn-group">
        <button type="button" class="chip-btn chip-primary" id="export-png-btn">Export PNG</button>
        <label class="chip-toggle" title="Save PNG with transparent background">
          <input type="checkbox" id="transparent-png">
          <span>Transparent</span>
        </label>
      </div>
      <div class="export-btn-group">
        <button type="button" class="chip-btn" id="export-webm-btn">Record Video (6s)</button>
        <button type="button" class="chip-btn" id="export-settings-btn">JSON</button>
      </div>
    </div>
    <div id="export-popup-msg" class="export-popup-msg"></div>
  </div>

  <!-- Interactive Customize Console (No Dark Dimmer: Canvas Stays 100% Bright & Visible) -->
  <aside id="controls" class="customize-console collapsed" role="region" aria-label="Customize Console">
    <div class="console-handle" aria-hidden="true"></div>

    <div class="console-header">
      <div class="active-tool-info">
        <span class="active-tool-name" id="active-tool-label">Particle Size</span>
        <span class="active-tool-val" id="active-tool-value">1.6</span>
      </div>
      <div class="console-header-actions">
        <!-- Single Explicit Reset Button -->
        <button id="reset-btn" class="console-reset-btn" title="Reset All Settings to Defaults">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
          <span>Reset</span>
        </button>
        <button id="close-panel-btn" class="console-icon-btn close-btn" title="Close Console">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Active Tool Control Area (Shows the slider for the active tool) -->
    <div class="active-control-area">
      <!-- Universal Active Slider View -->
      <div id="tool-slider-view" class="tool-view active">
        <div class="slider-wrapper">
          <span class="slider-bound min-bound" id="active-slider-min">0.8</span>
          <input type="range" id="active-slider" min="0.8" max="5.0" step="0.1" value="1.6" aria-label="Tool adjustment slider">
          <span class="slider-bound max-bound" id="active-slider-max">5.0</span>
        </div>
      </div>

      <!-- Palette Chips View (Horizontally Scrollable) -->
      <div id="tool-palette-view" class="tool-view">
        <div class="palette-chips">
          <button type="button" class="chip-btn active" data-mode="original">Original + Tints</button>
          <button type="button" class="chip-btn" data-mode="mono">Monochrome</button>
          <button type="button" class="chip-btn" data-mode="cyber">Cyberpunk Neon</button>
          <button type="button" class="chip-btn" data-mode="aurora">Aurora Spectrum</button>
          <button type="button" class="chip-btn" data-mode="ember">Ember Flame</button>
          <button type="button" class="chip-btn" data-mode="matrix">Matrix Emerald</button>
          <button type="button" class="chip-btn" data-mode="sepia">Vintage Sepia</button>
        </div>
      </div>

      <!-- Canvas Dimension & Fit View (Active when Canvas tool is selected) -->
      <div id="tool-canvas-view" class="tool-view">
        <div class="canvas-controls-inline">
          <input type="number" id="cw" min="100" max="3000" placeholder="Auto W">
          <span>&times;</span>
          <input type="number" id="ch" min="100" max="3000" placeholder="Auto H">
          <select id="fit">
            <option value="contain">Contain</option>
            <option value="cover">Cover</option>
            <option value="stretch">Stretch</option>
          </select>
          <button type="button" class="chip-btn" id="auto-size">Auto Fit</button>
        </div>
      </div>

      <!-- Audio Reactive View (Distort Particles with Audio Signal) -->
      <div id="tool-audio-view" class="tool-view">
        <div class="audio-controls-inline">
          <button type="button" class="chip-btn" id="audio-mic-btn" title="Toggle Live Microphone Reactivity">🎤 Mic</button>
          <label class="chip-btn file-chip" title="Upload Audio File (MP3/WAV/AAC)">
            📁 Track
            <input type="file" id="audio-file-input" accept="audio/*" hidden>
          </label>
          <button type="button" class="chip-btn" id="audio-demo-btn" title="Play Built-in Demo Synth Beat">🎵 Beat</button>
          <button type="button" class="chip-btn active" id="audio-stop-btn" title="Turn Off Audio Reactivity">⏹ Off</button>
          <div class="audio-sens-wrap" title="Audio Signal Distortion Intensity">
            <span class="audio-sens-label">Sens</span>
            <input type="range" id="audio-sens-slider" min="0.5" max="3.0" step="0.1" value="1.4" aria-label="Audio Distortion Intensity">
            <span id="audio-sens-val">1.4</span>
          </div>
        </div>
      </div>

      <!-- Gyroscope Gravity View (Physics Driven by Device Tilt) -->
      <div id="tool-gyro-view" class="tool-view">
        <div class="gyro-controls-inline">
          <button type="button" class="chip-btn" id="gyro-toggle-btn" title="Toggle Mobile Gyroscope Gravity">
            <span class="gyro-status-dot"></span>
            <span id="gyro-toggle-text">Gravity: OFF</span>
          </button>
          <div class="gyro-modes-group">
            <button type="button" class="chip-btn active" data-gyro-mode="fluid" id="gyro-mode-fluid" title="Elastic fluid tilt suspension">Fluid Flow</button>
            <button type="button" class="chip-btn" data-gyro-mode="cascade" id="gyro-mode-cascade" title="Free-fall particle cascade">Cascade</button>
          </div>
          <button type="button" class="chip-btn" id="gyro-calibrate-btn" title="Calibrate current orientation as level center">🎯 Zero</button>
          <div class="gyro-sens-wrap" title="Gravity Force Intensity">
            <span class="gyro-sens-label">Force</span>
            <input type="range" id="gyro-strength-slider" min="0.3" max="3.0" step="0.1" value="1.2" aria-label="Gravity Force Intensity">
            <span id="gyro-strength-val">1.2</span>
          </div>
          <div class="gyro-tilt-widget" id="gyro-tilt-widget" title="Tilt direction indicator (drag to simulate tilt on desktop)">
            <div class="gyro-tilt-cross"></div>
            <div class="gyro-tilt-dot" id="gyro-tilt-dot"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Horizontal Scrollable Tool Carousel -->
    <nav class="tools-carousel" id="tools-carousel" aria-label="Adjustment Tools">
      <!-- Generated dynamically in app.js -->
    </nav>

    <!-- Diagnostics Sub-bar -->
    <div class="console-diagnostics">
      <span id="fps-counter">FPS: 60</span>
      <span id="particle-info">Particles: --</span>
      <span id="res-info">--</span>
      <span id="export-msg" class="console-status-msg"></span>
    </div>
  </aside>

  <!-- Bottom Interaction Hint -->
  <div class="hint" id="hint">Touch or hover over particles to interact</div>

  <script src="app.js" defer></script>
</body>
</html>
